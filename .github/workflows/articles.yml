name: Build articles

on:
  push:
    branches: [main]
    paths:
      - "articles/src/**"
      - "articles/template.html"
      - "articles/list-template.html"
      - "articles/articles.css"
      - "articles/build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pygments
      - run: python3 articles/build.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build articles [skip ci]"
          git push

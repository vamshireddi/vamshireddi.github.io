<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Data 360 reference flow: enterprise sources, ingestion, harmonization, unification, and activation for people and agents, with governance across every stage" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#b8c4e6"/></marker>
  </defs>
  <rect width="1200" height="680" rx="16" fill="#0d0d22"/>
  <text x="34" y="54" fill="#f0c35a" font-size="15" letter-spacing="2" font-weight="700">DATA 360 REFERENCE FLOW · FROM SOURCE TO AGENT</text>

  <!-- column headers -->
  <g fill="#e2e5f3" font-size="14" letter-spacing="1.5" font-weight="600">
    <text x="34" y="98">1 · SOURCES</text>
    <text x="263" y="98">2 · INGEST</text>
    <text x="492" y="98">3 · HARMONIZE</text>
    <text x="721" y="98">4 · UNIFY</text>
    <text x="950" y="98">5 · ACT</text>
  </g>

  <!-- 1 sources -->
  <g text-anchor="middle" font-size="16.5" font-weight="600" fill="#fff">
    <rect x="34" y="112" width="215" height="64" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="141.5" y="139">Salesforce clouds</text><text x="141.5" y="161" fill="#d3d7ea" font-size="14" font-weight="400">Sales · Service · Marketing</text>
    <rect x="34" y="184" width="215" height="64" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="141.5" y="211">ERP</text><text x="141.5" y="233" fill="#d3d7ea" font-size="14" font-weight="400">SAP · Oracle · agreements</text>
    <rect x="34" y="256" width="215" height="64" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="141.5" y="283">Dealers &amp; distributors</text><text x="141.5" y="305" fill="#d3d7ea" font-size="14" font-weight="400">portals · DMS · partners</text>
    <rect x="34" y="328" width="215" height="64" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="141.5" y="355">Service &amp; warranty</text><text x="141.5" y="377" fill="#d3d7ea" font-size="14" font-weight="400">cases · claims · service</text>
    <rect x="34" y="400" width="215" height="64" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="141.5" y="427">Connected products</text><text x="141.5" y="449" fill="#d3d7ea" font-size="14" font-weight="400">telemetry · IoT · usage</text>
    <rect x="34" y="472" width="215" height="64" rx="10" fill="#221f3a" stroke="#f0c35a" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="141.5" y="499">Data lake</text><text x="141.5" y="521" fill="#e3dcc6" font-size="14" font-weight="400">Snowflake · Databricks</text>
  </g>

  <!-- 2 ingest -->
  <g text-anchor="middle" font-size="16.5" font-weight="600" fill="#fff">
    <rect x="263" y="112" width="215" height="128" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="370.5" y="144">Data streams</text>
    <g fill="#d3d7ea" font-size="14" font-weight="400">
      <text x="370.5" y="170">connectors · Ingestion API</text>
      <text x="370.5" y="192">MuleSoft · cloud storage</text>
      <text x="370.5" y="214">batch or streaming</text>
    </g>
    <rect x="263" y="256" width="215" height="128" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="370.5" y="312">Data lake objects</text>
    <text x="370.5" y="338" fill="#d3d7ea" font-size="14" font-weight="400">raw, as the source sent it</text>
    <rect x="263" y="400" width="215" height="136" rx="10" fill="#221f3a" stroke="#f0c35a" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="370.5" y="450">Zero copy</text>
    <g fill="#e3dcc6" font-size="14" font-weight="400">
      <text x="370.5" y="476">query in place,</text>
      <text x="370.5" y="498">no second source of truth</text>
    </g>
  </g>

  <!-- 3 harmonize -->
  <g text-anchor="middle" font-size="16.5" font-weight="600" fill="#fff">
    <rect x="492" y="112" width="215" height="190" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="599.5" y="170">Data model objects</text>
    <g fill="#d3d7ea" font-size="14" font-weight="400">
      <text x="599.5" y="198">one common model for</text>
      <text x="599.5" y="220">customer · account · asset</text>
      <text x="599.5" y="248">mapping · formulas</text>
    </g>
    <rect x="492" y="318" width="215" height="218" rx="10" fill="#221f3a" stroke="#f0c35a" stroke-width="1.8"/>
    <text x="599.5" y="384">Signed-off definitions</text>
    <g fill="#e3dcc6" font-size="14" font-weight="400">
      <text x="599.5" y="414">what is a customer?</text>
      <text x="599.5" y="438">which source wins?</text>
      <text x="599.5" y="462">who decides?</text>
    </g>
  </g>

  <!-- 4 unify -->
  <g text-anchor="middle" font-size="16.5" font-weight="600" fill="#fff">
    <rect x="721" y="112" width="215" height="108" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="828.5" y="142">Match rules</text>
    <g fill="#d3d7ea" font-size="14" font-weight="400">
      <text x="828.5" y="166">exact · exact normalized</text>
      <text x="828.5" y="186">or fuzzy</text>
      <text x="828.5" y="206">email · phone · party IDs</text>
    </g>
    <rect x="721" y="236" width="215" height="108" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="828.5" y="272">Reconciliation rules</text>
    <g fill="#d3d7ea" font-size="14" font-weight="400">
      <text x="828.5" y="298">source priority</text>
      <text x="828.5" y="320">most recent · most frequent</text>
    </g>
    <rect x="721" y="360" width="215" height="176" rx="10" fill="#221f3a" stroke="#f0c35a" stroke-width="1.8"/>
    <text x="828.5" y="410">Unified profiles</text>
    <g fill="#e3dcc6" font-size="14" font-weight="400">
      <text x="828.5" y="438">Unified Individual</text>
      <text x="828.5" y="460">Unified Account</text>
      <text x="828.5" y="490">one record per person</text>
      <text x="828.5" y="510">or company</text>
    </g>
  </g>

  <!-- 5 act -->
  <g text-anchor="middle" font-size="16.5" font-weight="600" fill="#fff">
    <rect x="950" y="112" width="215" height="98" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="1057.5" y="155">Insights</text><text x="1057.5" y="179" fill="#d3d7ea" font-size="14" font-weight="400">calculated · streaming</text>
    <rect x="950" y="222" width="215" height="98" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="1057.5" y="265">Segments &amp; activation</text><text x="1057.5" y="289" fill="#d3d7ea" font-size="14" font-weight="400">marketing · ads · storage</text>
    <rect x="950" y="332" width="215" height="98" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="1057.5" y="375">Data actions</text><text x="1057.5" y="399" fill="#d3d7ea" font-size="14" font-weight="400">trigger Flows · events</text>
    <rect x="950" y="442" width="215" height="94" rx="10" fill="#221f3a" stroke="#f0c35a" stroke-width="1.8"/>
    <text x="1057.5" y="476">Agentforce grounding</text>
    <g fill="#e3dcc6" font-size="14" font-weight="400">
      <text x="1057.5" y="500">data graphs · retrievers</text>
      <text x="1057.5" y="520">search index</text>
    </g>
  </g>

  <!-- flow arrows -->
  <g stroke="#b8c4e6" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M250 176H261"/>
    <path d="M250 504H261"/>
    <path d="M479 176H490"/>
    <path d="M479 320H490"/>
    <path d="M479 468H490"/>
    <path d="M708 206H719"/>
    <path d="M708 427H719"/>
    <path d="M937 450H948"/>
  </g>

  <!-- governance band -->
  <rect x="34" y="560" width="1131" height="90" rx="10" fill="#1b1b44" stroke="#f0c35a" stroke-width="1.8"/>
  <text x="599.5" y="594" fill="#f0c35a" font-size="15" letter-spacing="2" font-weight="700" text-anchor="middle">GOVERNANCE ACROSS EVERY STAGE</text>
  <text x="599.5" y="626" fill="#eef0f8" font-size="17" text-anchor="middle">data spaces · consent · access policies · consumption, estimated up front</text>
</svg>

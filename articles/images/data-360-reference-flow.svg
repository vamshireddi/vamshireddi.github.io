<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Data 360 reference flow: enterprise sources, ingestion, harmonization, unification, and activation for people and agents, with governance across every stage" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#7a86a8"/></marker>
  </defs>
  <rect width="1200" height="660" rx="16" fill="#0f0f24"/>
  <text x="34" y="52" fill="#d4a843" font-size="13" letter-spacing="2" font-weight="600">DATA 360 REFERENCE FLOW · FROM SOURCE TO AGENT</text>

  <!-- column headers -->
  <g fill="#a0a0b8" font-size="12" letter-spacing="1.5">
    <text x="34" y="100">1 · SOURCES</text>
    <text x="264" y="100">2 · INGEST</text>
    <text x="494" y="100">3 · HARMONIZE</text>
    <text x="724" y="100">4 · UNIFY</text>
    <text x="954" y="100">5 · ACT</text>
  </g>

  <!-- 1 sources -->
  <g font-size="14" fill="#f0f0f5" text-anchor="middle">
    <rect x="34" y="116" width="212" height="58" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="140" y="141">Salesforce clouds</text><text x="140" y="159" fill="#a0a0b8" font-size="12">Sales · Service · Marketing</text>
    <rect x="34" y="186" width="212" height="58" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="140" y="211">ERP</text><text x="140" y="229" fill="#a0a0b8" font-size="12">SAP · Oracle · orders · agreements</text>
    <rect x="34" y="256" width="212" height="58" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="140" y="281">Dealers &amp; distributors</text><text x="140" y="299" fill="#a0a0b8" font-size="12">portals · DMS · partner data</text>
    <rect x="34" y="326" width="212" height="58" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="140" y="351">Service &amp; warranty</text><text x="140" y="369" fill="#a0a0b8" font-size="12">cases · claims · field service</text>
    <rect x="34" y="396" width="212" height="58" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="140" y="421">Connected products</text><text x="140" y="439" fill="#a0a0b8" font-size="12">telemetry · IoT · usage</text>
    <rect x="34" y="466" width="212" height="58" rx="10" fill="#141432" stroke="#d4a843" stroke-opacity=".7" stroke-dasharray="6 5"/>
    <text x="140" y="491">Data lake</text><text x="140" y="509" fill="#a0a0b8" font-size="12">Snowflake · Databricks</text>
  </g>

  <!-- 2 ingest -->
  <g font-size="14" fill="#f0f0f5" text-anchor="middle">
    <rect x="264" y="116" width="212" height="120" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="370" y="148">Data streams</text>
    <text x="370" y="172" fill="#a0a0b8" font-size="12">connectors · Ingestion API</text>
    <text x="370" y="190" fill="#a0a0b8" font-size="12">MuleSoft · cloud storage</text>
    <text x="370" y="208" fill="#a0a0b8" font-size="12">batch or streaming</text>
    <rect x="264" y="256" width="212" height="112" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="370" y="302">Data lake objects</text>
    <text x="370" y="324" fill="#a0a0b8" font-size="12">raw, as the source sent it</text>
    <rect x="264" y="396" width="212" height="128" rx="10" fill="#141432" stroke="#d4a843" stroke-opacity=".7" stroke-dasharray="6 5"/>
    <text x="370" y="438">Zero copy</text>
    <text x="370" y="462" fill="#a0a0b8" font-size="12">query in place,</text>
    <text x="370" y="480" fill="#a0a0b8" font-size="12">no second source of truth</text>
  </g>

  <!-- 3 harmonize -->
  <g font-size="14" fill="#f0f0f5" text-anchor="middle">
    <rect x="494" y="116" width="212" height="180" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="600" y="176">Data model objects</text>
    <text x="600" y="200" fill="#a0a0b8" font-size="12">one common model for</text>
    <text x="600" y="218" fill="#a0a0b8" font-size="12">customer · account · asset</text>
    <text x="600" y="240" fill="#a0a0b8" font-size="12">mapping · formulas</text>
    <rect x="494" y="316" width="212" height="208" rx="10" fill="#171735" stroke="#d4a843" stroke-opacity=".6"/>
    <text x="600" y="376">Signed-off definitions</text>
    <text x="600" y="402" fill="#a0a0b8" font-size="12">what is a customer?</text>
    <text x="600" y="424" fill="#a0a0b8" font-size="12">which source wins?</text>
    <text x="600" y="446" fill="#a0a0b8" font-size="12">who decides?</text>
  </g>

  <!-- 4 unify -->
  <g font-size="14" fill="#f0f0f5" text-anchor="middle">
    <rect x="724" y="116" width="212" height="100" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="830" y="152">Match rules</text>
    <text x="830" y="174" fill="#a0a0b8" font-size="12">exact · normalized · fuzzy</text>
    <text x="830" y="192" fill="#a0a0b8" font-size="12">email · phone · party IDs</text>
    <rect x="724" y="236" width="212" height="100" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="830" y="272">Reconciliation rules</text>
    <text x="830" y="294" fill="#a0a0b8" font-size="12">source priority · most recent</text>
    <text x="830" y="312" fill="#a0a0b8" font-size="12">most frequent</text>
    <rect x="724" y="356" width="212" height="168" rx="10" fill="#171735" stroke="#d4a843" stroke-opacity=".6"/>
    <text x="830" y="410">Unified profiles</text>
    <text x="830" y="436" fill="#a0a0b8" font-size="12">Unified Individual</text>
    <text x="830" y="456" fill="#a0a0b8" font-size="12">Unified Account</text>
    <text x="830" y="482" fill="#a0a0b8" font-size="12">one record per person or company</text>
  </g>

  <!-- 5 act -->
  <g font-size="14" fill="#f0f0f5" text-anchor="middle">
    <rect x="954" y="116" width="212" height="94" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="1060" y="154">Insights</text><text x="1060" y="176" fill="#a0a0b8" font-size="12">calculated · streaming</text>
    <rect x="954" y="220" width="212" height="94" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="1060" y="258">Segments &amp; activation</text><text x="1060" y="280" fill="#a0a0b8" font-size="12">marketing · ads · storage</text>
    <rect x="954" y="324" width="212" height="94" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="1060" y="362">Data actions</text><text x="1060" y="384" fill="#a0a0b8" font-size="12">trigger Flows · events</text>
    <rect x="954" y="428" width="212" height="96" rx="10" fill="#171735" stroke="#d4a843" stroke-opacity=".6"/>
    <text x="1060" y="464">Agentforce grounding</text>
    <text x="1060" y="486" fill="#a0a0b8" font-size="12">data graphs · retrievers</text>
    <text x="1060" y="504" fill="#a0a0b8" font-size="12">search index</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#7a86a8" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M248 176H262"/>
    <path d="M248 495H262"/>
    <path d="M478 176H492"/>
    <path d="M478 312H492"/>
    <path d="M478 460L492 460"/>
    <path d="M708 206H722"/>
    <path d="M708 420H722"/>
    <path d="M938 440H952"/>
  </g>

  <!-- governance band -->
  <rect x="34" y="552" width="1132" height="76" rx="10" fill="#141432" stroke="#d4a843" stroke-opacity=".45"/>
  <text x="600" y="582" fill="#d4a843" font-size="12" letter-spacing="2" font-weight="600" text-anchor="middle">GOVERNANCE ACROSS EVERY STAGE</text>
  <text x="600" y="608" fill="#c8c8d8" font-size="14" text-anchor="middle">data spaces · consent · access policies · consumption, estimated up front</text>
</svg>

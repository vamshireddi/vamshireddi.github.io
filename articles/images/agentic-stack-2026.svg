<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The Salesforce agentic stack after Dreamforce 2026: AIforce surfaces, the Headless Toolkit, agents and reasoning, Data 360 context, and systems of record, wrapped by the Trusted Enterprise AI Harness" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="612" rx="16" fill="#0f0f24"/>
  <text x="34" y="52" fill="#d4a843" font-size="13" letter-spacing="2" font-weight="600">THE SALESFORCE AGENTIC STACK AFTER DREAMFORCE 2026</text>

  <!-- 1 surfaces -->
  <text x="34" y="92" fill="#a0a0b8" font-size="12" letter-spacing="1.5">1 · SURFACES (AIFORCE)</text>
  <g font-size="14" fill="#f0f0f5" text-anchor="middle">
    <rect x="34" y="104" width="238" height="64" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="153" y="132">Claudeforce</text><text x="153" y="152" fill="#a0a0b8" font-size="12">Salesforce inside Claude · beta</text>
    <rect x="288" y="104" width="238" height="64" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="407" y="132">Slackforce</text><text x="407" y="152" fill="#a0a0b8" font-size="12">Slackbot · Slack surfaces</text>
    <rect x="542" y="104" width="238" height="64" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="661" y="132">Agentforce Coworker</text><text x="661" y="152" fill="#a0a0b8" font-size="12">in Lightning · available now</text>
    <rect x="796" y="104" width="238" height="64" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="915" y="132">Your apps and agents</text><text x="915" y="152" fill="#a0a0b8" font-size="12">MCP · APIs · CLI</text>
  </g>

  <!-- 2 headless -->
  <text x="34" y="196" fill="#a0a0b8" font-size="12" letter-spacing="1.5">2 · HEADLESS TOOLKIT (INTRODUCED AS HEADLESS 360, APRIL 2026)</text>
  <rect x="34" y="208" width="1000" height="60" rx="10" fill="#171735" stroke="#4a9eff" stroke-opacity=".5"/>
  <g text-anchor="middle">
    <text x="534" y="234" fill="#f0f0f5" font-size="14">Every capability is an API, an MCP tool or a CLI command</text>
    <text x="534" y="254" fill="#a0a0b8" font-size="12">Headless Data 360 exposes 200+ Data 360 APIs to agents over MCP</text>
  </g>

  <!-- 3 agents -->
  <text x="34" y="296" fill="#a0a0b8" font-size="12" letter-spacing="1.5">3 · AGENTS AND REASONING</text>
  <g font-size="14" fill="#f0f0f5" text-anchor="middle">
    <rect x="34" y="308" width="322" height="64" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="195" y="336">Agentforce</text><text x="195" y="356" fill="#a0a0b8" font-size="12">subagents · multi-agent orchestration</text>
    <rect x="372" y="308" width="322" height="64" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="533" y="336">Reasoning models</text><text x="533" y="356" fill="#a0a0b8" font-size="12">Claude · Koa (pilot) · others</text>
    <rect x="710" y="308" width="324" height="64" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="872" y="336">MuleSoft Agent Fabric</text><text x="872" y="356" fill="#a0a0b8" font-size="12">govern and orchestrate agents</text>
  </g>

  <!-- 4 context -->
  <text x="34" y="400" fill="#d4a843" font-size="12" letter-spacing="1.5" font-weight="600">4 · CONTEXT (DATA 360)</text>
  <g font-size="14" fill="#f0f0f5" text-anchor="middle">
    <rect x="34" y="412" width="322" height="72" rx="10" fill="#171735" stroke="#d4a843" stroke-opacity=".7"/>
    <text x="195" y="442">Harmonized, unified data</text><text x="195" y="464" fill="#a0a0b8" font-size="12">one customer · one account</text>
    <rect x="372" y="412" width="322" height="72" rx="10" fill="#171735" stroke="#d4a843" stroke-opacity=".7"/>
    <text x="533" y="442">Agent Context Engine</text><text x="533" y="464" fill="#a0a0b8" font-size="12">governed context · GA expected late 2026</text>
    <rect x="710" y="412" width="324" height="72" rx="10" fill="#171735" stroke="#d4a843" stroke-opacity=".7"/>
    <text x="872" y="442">Zero copy</text><text x="872" y="464" fill="#a0a0b8" font-size="12">Snowflake · Databricks · AWS · Google</text>
  </g>

  <!-- 5 systems of record -->
  <text x="34" y="512" fill="#a0a0b8" font-size="12" letter-spacing="1.5">5 · SYSTEMS OF RECORD</text>
  <rect x="34" y="524" width="1000" height="52" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".35"/>
  <text x="534" y="555" fill="#c8c8d8" font-size="14" text-anchor="middle">ERP · dealer and distributor systems · service and warranty · connected products · data lake</text>

  <!-- harness -->
  <rect x="1052" y="80" width="114" height="496" rx="10" fill="#141432" stroke="#d4a843" stroke-opacity=".45"/>
  <g transform="translate(1102 328) rotate(-90)" text-anchor="middle">
    <text x="0" y="0" fill="#d4a843" font-size="13" letter-spacing="2" font-weight="600">TRUSTED ENTERPRISE AI HARNESS</text>
    <text x="0" y="24" fill="#a0a0b8" font-size="12">governance · security · AI Control Plane</text>
  </g>
</svg>

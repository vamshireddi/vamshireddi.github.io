<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The Salesforce agentic stack after Dreamforce 2026: AIforce surfaces, the Headless Toolkit, agents and reasoning, Data 360 context, and systems of record, wrapped by the Trusted Enterprise AI Harness" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="700" rx="16" fill="#0d0d22"/>
  <text x="34" y="54" fill="#f0c35a" font-size="15" letter-spacing="2" font-weight="700">THE SALESFORCE AGENTIC STACK AFTER DREAMFORCE 2026</text>

  <!-- 1 surfaces -->
  <text x="34" y="98" fill="#e2e5f3" font-size="14" letter-spacing="1.5" font-weight="600">1 · SURFACES (AIFORCE)</text>
  <g text-anchor="middle">
    <rect x="34" y="112" width="253" height="76" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="160.5" y="144" fill="#fff" font-size="18" font-weight="600">Claudeforce</text><text x="160.5" y="169" fill="#d3d7ea" font-size="15">Salesforce in Claude · beta</text>
    <rect x="303" y="112" width="253" height="76" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="429.5" y="144" fill="#fff" font-size="18" font-weight="600">Slackforce</text><text x="429.5" y="169" fill="#d3d7ea" font-size="15">Slackbot · Slack surfaces</text>
    <rect x="572" y="112" width="253" height="76" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="698.5" y="144" fill="#fff" font-size="18" font-weight="600">Agentforce Coworker</text><text x="698.5" y="169" fill="#d3d7ea" font-size="15">in Lightning · available now</text>
    <rect x="841" y="112" width="253" height="76" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="967.5" y="144" fill="#fff" font-size="18" font-weight="600">Your apps and agents</text><text x="967.5" y="169" fill="#d3d7ea" font-size="15">MCP · APIs · CLI</text>
  </g>

  <!-- 2 headless -->
  <text x="34" y="222" fill="#e2e5f3" font-size="14" letter-spacing="1.5" font-weight="600">2 · HEADLESS TOOLKIT (INTRODUCED AS HEADLESS 360, APRIL 2026)</text>
  <rect x="34" y="236" width="1060" height="72" rx="10" fill="#1b1b44" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="564" y="267" fill="#fff" font-size="18" font-weight="600">Every capability is an API, an MCP tool or a CLI command</text>
    <text x="564" y="292" fill="#d3d7ea" font-size="15">Headless Data 360: 200+ Data 360 APIs for agents over MCP</text>
  </g>

  <!-- 3 agents -->
  <text x="34" y="342" fill="#e2e5f3" font-size="14" letter-spacing="1.5" font-weight="600">3 · AGENTS AND REASONING</text>
  <g text-anchor="middle">
    <rect x="34" y="356" width="342" height="76" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="205" y="388" fill="#fff" font-size="18" font-weight="600">Agentforce</text><text x="205" y="413" fill="#d3d7ea" font-size="15">subagents · multi-agent orchestration</text>
    <rect x="392" y="356" width="342" height="76" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="563" y="388" fill="#fff" font-size="18" font-weight="600">Reasoning models</text><text x="563" y="413" fill="#d3d7ea" font-size="15">Claude · Koa (pilot) · others</text>
    <rect x="750" y="356" width="344" height="76" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".8" stroke-width="1.5"/>

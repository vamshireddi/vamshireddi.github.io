  </g>

  <!-- 4 context -->
  <text x="34" y="466" fill="#f0c35a" font-size="14" letter-spacing="1.5" font-weight="700">4 · CONTEXT (DATA 360)</text>
  <g text-anchor="middle">
    <rect x="34" y="480" width="342" height="82" rx="10" fill="#221f3a" stroke="#f0c35a" stroke-width="1.8"/>
    <text x="205" y="514" fill="#fff" font-size="18" font-weight="600">Harmonized, unified data</text><text x="205" y="541" fill="#e3dcc6" font-size="15">one customer · one account</text>
    <rect x="392" y="480" width="342" height="82" rx="10" fill="#221f3a" stroke="#f0c35a" stroke-width="1.8"/>
    <text x="563" y="514" fill="#fff" font-size="18" font-weight="600">Agent Context Engine</text><text x="563" y="541" fill="#e3dcc6" font-size="15">governed context · GA expected late 2026</text>
    <rect x="750" y="480" width="344" height="82" rx="10" fill="#221f3a" stroke="#f0c35a" stroke-width="1.8"/>
    <text x="922" y="514" fill="#fff" font-size="18" font-weight="600">Zero copy</text><text x="922" y="541" fill="#e3dcc6" font-size="15">Snowflake · Databricks · AWS · Google</text>
  </g>

  <!-- 5 systems of record -->
  <text x="34" y="596" fill="#e2e5f3" font-size="14" letter-spacing="1.5" font-weight="600">5 · SYSTEMS OF RECORD</text>
  <rect x="34" y="610" width="1060" height="60" rx="10" fill="#17173d" stroke="#6b9bff" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="564" y="646" fill="#eef0f8" font-size="17" text-anchor="middle">ERP · dealer and distributor systems · service and warranty · connected products · data lake</text>

  <!-- harness -->
  <rect x="1108" y="86" width="58" height="584" rx="10" fill="#1b1b44" stroke="#f0c35a" stroke-width="1.8"/>
  <g transform="translate(1133 378) rotate(-90)" text-anchor="middle">
    <text x="0" y="0" fill="#f0c35a" font-size="15" letter-spacing="2" font-weight="700">TRUSTED ENTERPRISE AI HARNESS</text>
    <text x="0" y="22" fill="#e2e5f3" font-size="13.5">governance · security · AI Control Plane</text>
  </g>

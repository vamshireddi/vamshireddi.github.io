<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 784" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="B2C reference architecture: experience surfaces, agent and API layer, engagement clouds, Data 360 spine, systems of record" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#b8c4e6"/></marker>
  </defs>
  <rect width="1200" height="784" rx="16" fill="#0d0d22"/>

    <text x="360" y="136">Mobile app / kiosk</text><text x="360" y="156" fill="#a0a0b8" font-size="12">Native · offline-first</text>
    <rect x="480" y="108" width="200" height="64" rx="10" fill="#141432" stroke="#4a9eff" stroke-opacity=".5"/>
    <text x="580" y="136">Messaging &amp; voice</text><text x="580" y="156" fill="#a0a0b8" font-size="12">WhatsApp · SMS · Agentforce Voice</text>
